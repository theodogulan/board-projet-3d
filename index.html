<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tableau de pilotage du projet</title>
<meta name="description" content="Le tableau de pilotage du projet présenté comme un objet 3D manipulable, avec ses quatre thèmes et ses huit fiches.">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<!-- Scène 3D -->
<canvas id="scene" aria-label="Tableau de pilotage du projet en trois dimensions" role="img"></canvas>

<!-- Cibles clavier, une par feuille, injectées par main.js -->
<div id="a11y-targets" class="a11y-targets" role="group" aria-label="Les huit fiches du tableau"></div>

<header class="topbar">
  <div class="topbar__title">
    <svg class="topbar__logo" viewBox="34.64 20.31 44.27 59.38" aria-hidden="true" focusable="false">
      <path d="M 39.71 20.31 L 39.71 51.82 A 20.70 20.70 0 0 0 60.42 72.53"
            fill="none" stroke="currentColor" stroke-width="10.16" />
      <rect x="34.64" y="36.20" width="23.17" height="8.85" fill="currentColor" />
      <circle cx="72.92" cy="73.70" r="5.99" fill="currentColor" />
    </svg>
    <span>Tableau de pilotage du projet</span>
  </div>
  <p class="topbar__hint" id="hint">Faites tourner le tableau, puis sélectionnez une fiche pour en savoir plus.</p>
</header>

<!-- Infobulle de survol -->
<div id="tooltip" class="tooltip" role="presentation" hidden></div>

<!-- Barre d'outils -->
<nav class="toolbar" aria-label="Contrôles de la vue">
  <button type="button" class="toolbar__btn is-active" data-action="front" aria-pressed="true"
          title="Voir les fiches" aria-label="Voir les fiches">
    <span class="toolbar__icon" aria-hidden="true">▣</span><span class="toolbar__label">Voir les fiches</span>
  </button>
  <button type="button" class="toolbar__btn" data-action="back" aria-pressed="false"
          title="Voir le mode d'emploi" aria-label="Voir le mode d'emploi">
    <span class="toolbar__icon" aria-hidden="true">▤</span><span class="toolbar__label">Voir le mode d'emploi</span>
  </button>
</nav>

<!-- Panneau latéral, bottom sheet sur mobile -->
<aside id="panel" class="panel" aria-live="polite" aria-label="Détail de la fiche" hidden>
  <div class="panel__grip" aria-hidden="true"></div>
  <button type="button" class="panel__close" data-action="close" aria-label="Fermer la fiche et revenir au tableau">✕</button>
  <div class="panel__scroll" id="panel-scroll"></div>
  <div class="panel__footer">
    <button type="button" class="btn btn--ghost" data-action="close">Retour au tableau</button>
  </div>
</aside>

<!-- Repli sans WebGL, rempli par main.js à partir de content.js -->
<main id="fallback" class="fallback" hidden></main>

<script type="module" src="main.js"></script>
</body>
</html>
